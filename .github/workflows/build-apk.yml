name: Build ShieldDNS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        run: gradle --no-daemon clean :app:assembleDebug :social:assembleDebug --stacktrace

      - name: Verify APKs
        run: |
          CORE=app/build/outputs/apk/debug/app-debug.apk
          SOCIAL=social/build/outputs/apk/debug/social-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)

          "$AAPT" dump badging "$CORE" | tee core-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$CORE" | tee core-signature.txt
          grep -q "package: name='com.fady.shielddnscore'" core-badging.txt

          "$AAPT" dump badging "$SOCIAL" | tee social-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$SOCIAL" | tee social-signature.txt
          grep -q "package: name='com.fady.shielddnssocial'" social-badging.txt

      - name: Prepare named APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShieldDNS-v0.6-core.apk
          cp social/build/outputs/apk/debug/social-debug.apk ShieldDNS-Social-v0.1.apk
          sha256sum ShieldDNS-v0.6-core.apk > ShieldDNS-v0.6-core.apk.sha256
          sha256sum ShieldDNS-Social-v0.1.apk > ShieldDNS-Social-v0.1.apk.sha256

      - name: Upload core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldDNS-v0.6-core
          path: |
            ShieldDNS-v0.6-core.apk
            ShieldDNS-v0.6-core.apk.sha256
            core-badging.txt
            core-signature.txt

      - name: Upload social artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldDNS-Social-v0.1
          path: |
            ShieldDNS-Social-v0.1.apk
            ShieldDNS-Social-v0.1.apk.sha256
            social-badging.txt
            social-signature.txt
