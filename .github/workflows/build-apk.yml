name: Build ShieldDNS APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build clean debug APK
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK package and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q "package: name='com.fady.shielddnscore'" apk-badging.txt

      - name: Prepare named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShieldDNS-v0.6-core.apk
          sha256sum ShieldDNS-v0.6-core.apk > ShieldDNS-v0.6-core.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldDNS-v0.6-core
          path: |
            ShieldDNS-v0.6-core.apk
            ShieldDNS-v0.6-core.apk.sha256
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30
